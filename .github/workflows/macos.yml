name: macOS compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-apple-silicon:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Confirm Apple Silicon runner
        run: python -c "import platform; assert platform.system() == 'Darwin' and platform.machine() == 'arm64', (platform.system(), platform.machine())"
      - name: Install editable package
        run: python -m pip install -e .
      - name: Check installed commands
        run: |
          privacygate --help
          privacygate-ui --help
          privacygate-check-mac --help
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run iteration validator
        run: python scripts/validate_iteration.py
