name: macOS compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-apple-silicon:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Confirm Apple Silicon runner
        run: python -c "import platform; assert platform.system() == 'Darwin' and platform.machine() == 'arm64', (platform.system(), platform.machine())"
      - name: Install editable package
        run: python -m pip install -e .
      - name: Check installed commands
        run: |
          privacygate --help
          privacygate-ui --help
          privacygate-check-mac --help
      - name: Install local OCR
        run: brew install tesseract
      - name: Benchmark synthetic OCR detection and localization
        run: python scripts/benchmark_uploads.py --require-perfect
      - name: Benchmark common synthetic documents as images and PDFs
        run: python scripts/benchmark_documents.py --require-perfect
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run iteration validator
        run: python scripts/validate_iteration.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test extension review and target guards
        run: node --test extension/review.test.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Installed-extension and annotated-preview integration
        run: node scripts/smoke_browser.cjs
